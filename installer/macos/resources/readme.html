<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      margin: 0;
      padding: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    h2 {
      font-size: 14px;
      margin: 16px 0 8px;
    }
    p {
      margin: 0 0 10px;
    }
    ul {
      margin: 0 0 10px 18px;
      padding: 0;
    }
  </style>
</head>
<body>
  <h1>About Xile</h1>
  <p>Xile installs an X11-oriented desktop environment with IceWM.</p>
  <h2>Installed files</h2>
  <ul>
    <li>/Applications/Xile.app</li>
    <li>/usr/local/bin/xile-recover</li>
  </ul>
  <h2>Recovery</h2>
  <p>If autostart needs to be disabled, run xile-recover from Terminal, then log out and log back in.</p>
</body>
</html>
